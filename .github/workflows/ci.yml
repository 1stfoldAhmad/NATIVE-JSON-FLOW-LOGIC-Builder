name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit + security/policy tests
        run: npm test

      - name: Build dist
        run: npm run build

      - name: Package export smoke test (dist entries . / ./expo / ./node)
        run: npm run smoke

      - name: Package contents (npm pack dry run)
        run: npm pack --dry-run

      - name: Expo/Metro compatibility guard (core must not import node:* built-ins)
        run: |
          if grep -rn --include='*.ts' -E 'from ["'"'"']node:' src --exclude='node-io.ts'; then
            echo 'FAIL: core imports node:* built-ins outside src/node-io.ts'
            exit 1
          fi
          echo 'OK: no node:* imports in the portable core'

      - name: Demo
        run: npm run demo

  # Bundle the Expo example app with Metro — proves the core + ./expo adapter
  # actually compile under Metro (the device-verification steps in
  # examples/expo-app/README.md still run on a device/emulator).
  expo-bundle:
    name: expo-bundle (Metro export of examples/expo-app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build the library (the app links it via file:../..)
        run: |
          npm ci
          npm run build

      - name: Install example app deps
        run: npm ci --prefix examples/expo-app || npm install --prefix examples/expo-app
        working-directory: examples/expo-app

      - name: Metro export (web bundle)
        run: npx expo export --platform web --output-dir dist-web
        working-directory: examples/expo-app
